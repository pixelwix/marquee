services:
  marquee:
    build: .
    container_name: ${CONTAINER_NAME:-marquee}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # HOST_PORT is what your reverse proxy/tunnel points at — the container
      # always listens on 4000 internally regardless (matches the Dockerfile
      # healthcheck), so this only changes the host side.
      - "${HOST_PORT:-4000}:4000"
    volumes:
      - ./data:/app/data
      # Read-write so the admin Settings page can edit it directly — Docker
      # Compose's env_file above only reads this at container start, so any
      # change here still needs a restart to actually take effect (the
      # settings save endpoint triggers one itself; see routes/settings.js).
      - ./.env:/app/.env
      # Optional, for the owner-only status panel: read-only bind mount of Uptime
      # Kuma's data directory, so the app can read kuma.db directly. Set
      # UPTIME_KUMA_DATA_DIR in .env to Kuma's data dir on the host, and
      # UPTIME_KUMA_DB_PATH=/app/uptime-kuma-data/kuma.db to match the destination
      # below. Left unset, this harmlessly re-mounts ./data and the feature stays off.
      - ${UPTIME_KUMA_DATA_DIR:-./data}:/app/uptime-kuma-data:ro
      # Optional, for the owner-only Disk Space panel: read-only bind mount of a
      # directory containing your NAS's media share mounts (one subdirectory per
      # share/volume) — powers real physical-volume storage data independent of
      # Radarr/Sonarr's own diskspace API. Set MEDIA_MOUNT_DIR in .env to that
      # directory on the host. Left unset, this harmlessly re-mounts ./data and
      # the feature stays off (falls back to the Radarr/Sonarr diskspace API).
      - ${MEDIA_MOUNT_DIR:-./data}:/app/media-mount:ro
