services:
  marquee:
    build: .
    container_name: ${CONTAINER_NAME:-marquee}
    restart: unless-stopped
    # No env_file directive — server.js's own `require('dotenv').config()`
    # already reads /app/.env directly at startup (see the bind mount
    # below), so an env_file: here would be pure duplication. Worth knowing
    # if you deploy this via Portainer specifically: Portainer's own
    # container typically can't see arbitrary host paths (only its own data
    # volume + the Docker socket), so an env_file: at an absolute host path
    # would fail for it to resolve — even though a *volume* bind mount to
    # that same path works fine there, since that's resolved by dockerd on
    # the real host, not by Portainer's own filesystem access.
    # Without this the container defaults to UTC. routes/sonarr.js's Airing
    # Today (localDateString, using JS's local-time getters) and anywhere
    # else "today" gets computed server-side both silently used the
    # container's own clock, which is 5-6 hours ahead of Central time —
    # that made Airing Today show tomorrow's episodes before local midnight.
    environment:
      - TZ=America/Chicago
    # No host port mapping — this deployment routes exclusively through the
    # docker-host Traefik container (see the `proxy` network + labels below),
    # which is why the container's own port 4000 never needs to be published
    # to the host. If you're not running behind that Traefik setup, add back
    # a `ports: ["${HOST_PORT:-4000}:4000"]` mapping instead of the
    # `networks`/`labels` block.
    # Relative paths below assume you run `docker compose` from this same
    # directory (the default). If you deploy via Portainer, it typically
    # runs compose from its own internal copy of this file rather than this
    # directory — relative paths would then resolve somewhere else entirely
    # and silently fork your data into two separate copies. Switch these to
    # absolute host paths in that case.
    volumes:
      - ./data:/app/data
      # Read-write so the admin Settings page can edit it directly — Docker
      # Compose's env_file above only reads this at container start, so any
      # change here still needs a restart to actually take effect (the
      # settings save endpoint triggers one itself; see routes/settings.js).
      - ./.env:/app/.env
      # Optional, for the owner-only status panel: read-only bind mount of Uptime
      # Kuma's data directory, so the app can read kuma.db directly. Set
      # UPTIME_KUMA_DATA_DIR in .env to Kuma's data dir on the host, and
      # UPTIME_KUMA_DB_PATH=/app/uptime-kuma-data/kuma.db to match the destination
      # below. Left unset, this harmlessly re-mounts ./data and the feature stays off.
      - ${UPTIME_KUMA_DATA_DIR:-./data}:/app/uptime-kuma-data:ro
      # Optional, for the owner-only Disk Space panel: read-only bind mount of a
      # directory containing your NAS's media share mounts (one subdirectory per
      # share/volume) — powers real physical-volume storage data independent of
      # Radarr/Sonarr's own diskspace API. Set MEDIA_MOUNT_DIR in .env to that
      # directory on the host. Left unset, this harmlessly re-mounts ./data and
      # the feature stays off (falls back to the Radarr/Sonarr diskspace API).
      - ${MEDIA_MOUNT_DIR:-./data}:/app/media-mount:ro
      # Optional, for mirroring the notice board onto the Plex Home screen via
      # Kometa (see lib/notice.js): read-write bind mount of Kometa's own config
      # directory, so posting/clearing a notice can write/remove a small
      # collection YAML there for Kometa to pick up on its next scheduled run.
      # Set KOMETA_CONFIG_DIR in .env to that directory on the host. Left
      # unset, this harmlessly re-mounts ./data and the feature stays off.
      - ${KOMETA_CONFIG_DIR:-./data}:/app/kometa-config:rw
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # MARQUEE_DOMAIN comes from .env (excluded from deploy.sh's rsync, same as
      # the rest of .env) — never hardcode a real domain here, this file is
      # public. Set MARQUEE_DOMAIN in your own .env to your real domain; left
      # unset, this harmlessly falls back to the placeholder below rather than
      # silently routing nothing.
      - "traefik.http.routers.marquee.rule=Host(`${MARQUEE_DOMAIN:-example.com}`) || Host(`www.${MARQUEE_DOMAIN:-example.com}`)"
      - "traefik.http.routers.marquee.entrypoints=websecure"
      - "traefik.http.routers.marquee.tls=true"
      - "traefik.http.routers.marquee.tls.certresolver=myresolver"
      - "traefik.http.services.marquee.loadbalancer.server.port=4000"

networks:
  proxy:
    external: true
