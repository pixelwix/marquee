<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2d38"/><stop offset="1" stop-color="#101219"/></linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffb347" stop-opacity=".28"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="250" x2="0" y2="780" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe2a0"/><stop offset=".45" stop-color="#ffb43f"/><stop offset="1" stop-color="#e07a10"/></linearGradient>
    <linearGradient id="spec" x1="0" y1="250" x2="0" y2="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="520" x2="0" y2="790" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8a3c00" stop-opacity="0"/><stop offset="1" stop-color="#8a3c00" stop-opacity=".35"/></linearGradient>
    <radialGradient id="teal" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#a6fff0"/><stop offset=".45" stop-color="#22c3a3"/><stop offset="1" stop-color="#0b7d66"/></radialGradient>
    <radialGradient id="tealglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#2be0bb" stop-opacity=".55"/><stop offset="1" stop-color="#2be0bb" stop-opacity="0"/></radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity=".5"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
    <!-- rounded play triangle -->
    <path id="play" d="M402 300Q370 282 370 318V706Q370 742 402 724L736 532Q768 512 736 494Z"/>
    <clipPath id="pc"><use href="#play"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="540" cy="520" r="330" fill="url(#halo)"/>
  <g filter="url(#drop)"><use href="#play" fill="url(#gold)"/></g>
  <g clip-path="url(#pc)">
    <rect x="340" y="500" width="460" height="300" fill="url(#shade)"/>
    <ellipse cx="470" cy="400" rx="150" ry="90" fill="#fff" opacity=".28" filter="url(#soft)"/>
  </g>
  <path d="M392 330V318Q392 300 410 310L700 478" fill="none" stroke="url(#spec)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="772" cy="252" r="110" fill="url(#tealglow)"/>
  <circle cx="772" cy="252" r="56" fill="url(#teal)"/>
  <path d="M736 232A40 40 0 0 1 790 208" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="7" stroke-linecap="round"/>
</svg>
